<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Document</title>
  </head>
  <body>
    <nav>
      <div class="nav__container">
        <div class="img__wrapper">
          <img src="assests/logo.png" alt="" class="nav__logo" />
        </div>
        <div class="nav__links">
          <a href="#home" class="nav__link">Home</a>
          <a href="" class="nav__link">Services</a>
          <a href="" class="nav__link">Packages</a>
          <a href="" class="nav__link">About Us</a>
          <a href="" class="nav__link">Gallery</a>
          <a href="" class="nav__link">Contact</a>
        </div>

        <button class="nav__btn">
          Book Now
          <span class="arrow"><i class="fa-solid fa-angle-right"></i></span>
        </button>
      </div>
    </nav>

    <header id="home">
        <div class="container">
            <div class="row header__row">

               
                <img src="assests/bmw.png" class="header__bg">
                <div class="header__text">
                    <h1 class="header__title">Premium Detailing <span class="header__span">Anywhere. </span> </h1>
                    <p class="header__para">Nazario Detailing is a one stop shop for all your automotive detailing needs. We offer a wide range of services to fit your needs.</p>

                    <div class="header__btn__wrap">
                        <button class="header__btn">Book Your Detail</button>
                        <button class="header__btn">Our Services</button>
                    </div>
                </div>

            </div>
        </div>
    </header>
  </body>
</html>
